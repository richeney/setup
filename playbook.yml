---
- hosts: localhost
  connection: local
  become: false
  gather_facts: true

  roles:
    - role: wsl_colours
      become: false

  tasks:

    # Azure CLI - Official Installation
    # https://learn.microsoft.com/en-us/cli/azure/install-azure-cli-linux
    - name: Install Azure CLI prerequisites
      become: true
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - apt-transport-https
          - lsb-release
          - gnupg
        state: present
        update_cache: yes

    - name: Create keyrings directory
      become: true
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download and install Microsoft signing key
      become: true
      ansible.builtin.shell: |
        curl -sLS https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /etc/apt/keyrings/microsoft.gpg
        chmod go+r /etc/apt/keyrings/microsoft.gpg
      args:
        creates: /etc/apt/keyrings/microsoft.gpg

    - name: Add Azure CLI repository
      become: true
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/azure-cli/ {{ ansible_distribution_release }} main"
        state: present
        filename: azure-cli

    - name: Install Azure CLI
      become: true
      ansible.builtin.apt:
        name: azure-cli
        state: present
        update_cache: yes

    # HashiCorp Tools - Terraform and Packer
    # https://www.hashicorp.com/official-packaging-guide
    - name: Download and install HashiCorp GPG key
      become: true
      ansible.builtin.shell: |
        curl -fsSL https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
        chmod go+r /usr/share/keyrings/hashicorp-archive-keyring.gpg
      args:
        creates: /usr/share/keyrings/hashicorp-archive-keyring.gpg

    - name: Add HashiCorp repository
      become: true
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main"
        state: present
        filename: hashicorp

    - name: Install Terraform and Packer
      become: true
      ansible.builtin.apt:
        name:
          - terraform
          - packer
        state: present
        update_cache: yes

    # wslu - WSL Utilities
    # https://github.com/wslutilities/wslu
    - name: Add wslu PPA key
      become: true
      ansible.builtin.apt_key:
        url: "https://pkg.wslutiliti.es/public.key"
        state: present

    - name: Add wslu repository
      become: true
      ansible.builtin.apt_repository:
        repo: "deb https://pkg.wslutiliti.es/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} main"
        state: present
        filename: wslu

    - name: Install wslu
      become: true
      ansible.builtin.apt:
        name: wslu
        state: present
        update_cache: yes

    - name: Enable passwordless sudo
      become: true
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/group
        state: present
        create: true
        owner: root
        group: root
        mode: 440
        regexp: '^%sudo'
        line: '%sudo ALL=(ALL) NOPASSWD: ALL'
        validate: 'visudo -cf %s'

    - name: Base utility packages
      become: true
      ansible.builtin.apt:
        name: "{{ packages }}"
        state: present
        update_cache: yes
      vars:
        packages:
          - git
          - jq
          - jp
          - tree
          - figlet
          - stress
          - speedtest-cli
          - hugo
          - aha
          - unzip

    - name: Ansible .bashrc - root customisations
      become: true
      ansible.builtin.blockinfile:
        path: ~/.bashrc
        block: |
          export EDITOR=vi
          alias ll='ls -l'
          set -o vi

    - name: Ansible .bashrc - jwt()
      ansible.builtin.blockinfile:
        path: ~richeney/.bashrc
        block: |
          {% raw %}
          # Decode JWT tokens
          _decode_base64_url() {
            local len=$((${#1} % 4))
            local result="$1"
            if [ $len -eq 2 ]; then result="$1"'=='
            elif [ $len -eq 3 ]; then result="$1"'='
            fi
            echo "$result" | tr '_-' '/+' | base64 -d
          }

          # $1 => JWT to decode
          # $2 => either 1 for header or 2 for body (default is 2)
          jwt() { _decode_base64_url $(echo -n $1 | cut -d "." -f ${2:-2}) | jq .; }

          {% endraw %}
        marker: "# <!-- {mark} of Ansible automated JWT function -->"
        marker_begin: Start
        marker_end: End
        backup: yes

    - name: Ansible .bashrc - user customisations
      ansible.builtin.blockinfile:
        path: ~richeney/.bashrc
        block: "{{ lookup('file', 'bashrc_user_customisations') }}"
        marker: "# <!-- {mark} of Ansible automated user customisations -->"
        marker_begin: Start
        marker_end: End
        backup: yes

    - name: /git
      become: true
      ansible.builtin.file:
        path: /git
        state: directory
        mode: '0755'
        owner: richeney
        group: richeney

    - name: Git config
      ansible.builtin.copy:
        dest: ~richeney/.gitconfig
        owner: richeney
        group: richeney
        mode: 0644
        content: |
          [user]
            email = richeney@microsoft.com
            name = Richard Cheney
          [credential]
            user = richeney
            helper = store
          [init]
            defaultBranch = main
